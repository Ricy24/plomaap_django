name: Pruebas

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev_Andres]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verificar pruebas no repetidas
        run: python scripts/check_test_duplicates.py

      - name: Pruebas entregadas del equipo
        run: python -m pytest api/tests/unit/equipo -q

      - name: Suite unitaria completa (490)
        run: python -m pytest -m unit -q

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: plomapp_test
          # Contenedor desechable: autenticación local sin contraseña.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plomapp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_USE_CONFIGURED_DB: '1'
      POSTGRES_DB: plomapp_test
      POSTGRES_USER: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_PASSWORD: ''
      SECRET_KEY: test-secret-key
      JWT_SECRET_KEY: test-jwt-secret-key
      DEBUG: 'True'

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pruebas de integración y contrato
        run: python -m pytest api/tests/integration -q --create-db
