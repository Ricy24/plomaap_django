name: Pruebas

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev_Andres, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: test-secret-key
  JWT_SECRET_KEY: test-jwt-secret-key
  DEBUG: 'True'
  PYTHONWARNINGS: ignore

jobs:
  calidad:
    name: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compilar codigo
        run: python -m compileall -q api config scripts
      - name: Lint
        run: ruff check .
      - name: Pruebas duplicadas
        run: python scripts/check_test_duplicates.py
      - name: Contrato de entregas
        run: python scripts/check_entrega_equipo.py
      - name: Seguridad (alto)
        run: bandit -q -r api -x api/tests,api/migrations -lll

  unit-sqlite:
    name: unit-sqlite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Suite unitaria
        run: python -m pytest -m unit -q
      - name: Entregas del equipo
        run: python -m pytest api/tests/unit/equipo -q
      - name: Cobertura
        run: |
          python -m coverage erase
          python -m coverage run --source=api/utils,api/services -m pytest -m unit -q
          python -m coverage report --fail-under=100 -m
          python -m coverage xml -o coverage.xml
      - name: Publicar cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
          retention-days: 15

  unit-postgres:
    name: unit-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: plomapp_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plomapp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_USE_CONFIGURED_DB: '1'
      DATABASE_URL: postgresql://postgres@localhost:5432/plomapp_test
      POSTGRES_DB: plomapp_test
      POSTGRES_USER: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Suite unitaria en PostgreSQL
        run: python -m pytest -m unit -q --create-db
      - name: Entregas del equipo en PostgreSQL
        run: python -m pytest api/tests/unit/equipo -q --create-db

  unit-mysql:
    name: unit-mysql
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: plomapp_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_USE_CONFIGURED_DB: '1'
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/plomapp_test
      DB_ENGINE: mysql
      MYSQL_DB: plomapp_test
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Suite unitaria en MySQL
        run: python -m pytest -m unit -q --create-db
      - name: Entregas del equipo en MySQL
        run: python -m pytest api/tests/unit/equipo -q --create-db

  integration-postgres:
    name: integration-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: plomapp_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plomapp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_USE_CONFIGURED_DB: '1'
      DATABASE_URL: postgresql://postgres@localhost:5432/plomapp_test
      POSTGRES_DB: plomapp_test
      POSTGRES_USER: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Integracion y contrato
        run: python -m pytest api/tests/integration -q --create-db

  mutacion:
    name: mutacion
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Roturas de todas las entregas presentes
        run: python scripts/mutar_entrega.py --todo

  informe:
    name: informe
    runs-on: ubuntu-latest
    needs: [calidad, unit-sqlite, unit-postgres, unit-mysql, integration-postgres, mutacion]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Generar Excel de entrega
        run: python scripts/informe_entrega.py --salida informe_entrega.xlsx
      - name: Publicar Excel de entrega
        uses: actions/upload-artifact@v4
        with:
          name: Plan_de_Pruebas_entrega
          path: informe_entrega.xlsx
          retention-days: 30

  required:
    name: required
    if: always()
    needs: [calidad, unit-sqlite, unit-postgres, unit-mysql, integration-postgres, mutacion]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar que todos los checks pasaron
        run: |
          echo "calidad=${{ needs.calidad.result }}"
          echo "unit-sqlite=${{ needs.unit-sqlite.result }}"
          echo "unit-postgres=${{ needs.unit-postgres.result }}"
          echo "unit-mysql=${{ needs.unit-mysql.result }}"
          echo "integration-postgres=${{ needs.integration-postgres.result }}"
          echo "mutacion=${{ needs.mutacion.result }}"
          test "${{ needs.calidad.result }}" = "success"
          test "${{ needs.unit-sqlite.result }}" = "success"
          test "${{ needs.unit-postgres.result }}" = "success"
          test "${{ needs.unit-mysql.result }}" = "success"
          test "${{ needs.integration-postgres.result }}" = "success"
          test "${{ needs.mutacion.result }}" = "success"
