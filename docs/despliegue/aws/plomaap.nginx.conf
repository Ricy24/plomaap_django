upstream plomaap_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
}

# HTTP -> HTTPS (y challenge de Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name plomaap.duckdns.org 18-221-80-56.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP de compatibilidad en :5000 (misma app, sin TLS)
server {
    listen 5000;
    server_name _;

    client_max_body_size 12M;

    location /static/uploads/ {
        proxy_pass http://plomaap_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/plomaap/backend/staticfiles/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://plomaap_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# HTTPS con balanceo round-robin entre los dos Gunicorn
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name plomaap.duckdns.org 18-221-80-56.nip.io;

    ssl_certificate     /etc/letsencrypt/live/18-221-80-56.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/18-221-80-56.nip.io/privkey.pem;

    client_max_body_size 12M;

    location /static/uploads/ {
        proxy_pass http://plomaap_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/plomaap/backend/staticfiles/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://plomaap_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
